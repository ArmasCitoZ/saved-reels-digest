# Tooling config only: the plugin itself has no build step.
[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Compact one-line argparse setup (`e = sub.add_parser(...); e.add_argument(...)`) is intentional.
ignore = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
