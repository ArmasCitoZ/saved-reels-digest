name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.9
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # oldest supported version (README says 3.9+); newer Ubuntu
          # runner images no longer ship a 3.9 build
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q

  install-windows:
    # install.ps1 from start to end, in the Windows PowerShell 5.1 a fresh Windows has:
    # it must create the environment, and doctor.py must then find it complete
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: keep the workspace in the runner's temp folder
        shell: bash
        run: echo "SRD_HOME=$RUNNER_TEMP\\srd" >> "$GITHUB_ENV"
      - name: install.ps1
        shell: powershell
        run: .\install.ps1
      - name: doctor.py sees a complete environment
        shell: powershell
        run: |
          & "$env:SRD_HOME\.venv\Scripts\python.exe" skills\digest\scripts\doctor.py --json | Tee-Object -Variable report
          if (-not ($report -join "`n" | ConvertFrom-Json).checks.Where({ $_.name -eq 'venv' -and $_.status -eq 'ok' })) { exit 1 }

  install-unix:
    # install.sh from start to end on Linux and macOS, then doctor.py must find a complete environment
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: echo "SRD_HOME=$RUNNER_TEMP/srd" >> "$GITHUB_ENV"
      - run: sh install.sh
      - name: doctor.py sees a complete environment
        run: |
          "$SRD_HOME/.venv/bin/python" skills/digest/scripts/doctor.py --json > report.json
          python -c "import json,sys; c={x['name']:x['status'] for x in json.load(open('report.json'))['checks']}; sys.exit(c['venv'] != 'ok')"
      - name: a second run reuses the environment
        run: sh install.sh | grep "already complete"

  rust:
    # the optional Rust duplicate finder (rust/): its own tests, then the Python test that
    # checks db.py similar gives the same groups with both engines, using the fresh binary
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # point the test at the fresh binary explicitly, so a missing build fails instead of skipping
      - name: db.py similar gives the same groups with Python and Rust
        shell: bash
        run: |
          exe=reels-similar; [ "$RUNNER_OS" = Windows ] && exe=reels-similar.exe
          # pwd -W gives a Windows path (D:/a/...) in Git Bash; elsewhere it fails and pwd is used
          dir=$(cd target/release && { pwd -W 2>/dev/null || pwd; })
          SRD_REELS_SIMILAR="$dir/$exe" python -m pytest -q ../tests/test_similar_rust.py

  viewer:
    # the TypeScript viewer (viewer/): typecheck, Vitest (which also compares its digest parser
    # with export_digest.py, so Python is needed) and the single-file build people open
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: |
            viewer/dist/index.html
            viewer/dist/demo.html
